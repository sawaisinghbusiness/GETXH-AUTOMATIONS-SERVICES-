<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src https://backend-for-getxh-automation.onrender.com; base-uri 'none'; form-action 'none'">
<title>Admin | GetXH Automation</title><link rel="stylesheet" href="assets/css/desk.css"><script defer src="assets/js/desk.js"></script></head>
<body><header><a class="brand" href="index.html"><img src="assets/logo.jpg" alt="">GetXH Automation</a><span>Administration</span></header>
<main><section id="login">
<form id="signin"><h1 id="title">Admin sign in</h1><p id="hint" hidden></p><label for="credential" id="caption">Password</label><input id="credential" type="password" required autocomplete="current-password" aria-describedby="hint state">
<button class="primary" id="submit">Continue</button><button type="button" id="restart" hidden>Back to password</button></form></section>
<section id="inbox" hidden><div class="heading"><h1>Enquiry inbox</h1><div><button id="refresh">Refresh</button> <button id="logout">Sign out</button></div></div>
<details class="blog-editor"><summary>Publish a blog post</summary><form id="postForm"><label>Title<input name="title" required maxlength="160"></label><label>Article<textarea name="body" required maxlength="60000" rows="10"></textarea></label><button class="primary" type="submit">Publish post</button><p id="postFeedback" role="status"></p></form></details><div class="tools"><label>Search enquiries<input type="search" id="search" placeholder="Name, business or phone"></label><label>Status<select id="filter"><option>All statuses</option><option>New</option><option>Contacted</option><option>Closed</option></select></label></div>
<p id="count"></p><div id="list"></div></section><p id="state" role="status"></p></main></body></html>
