<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enquiries | GetXH</title><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/studio.css"></head><body><main class="container section"><a href="/">GetXH Automation</a><section id="login" hidden><h1>Admin sign in</h1><form id="signin"><label id="caption" for="credential">Password</label><input id="credential" type="password" autocomplete="current-password" required><button id="submit" class="btn btn--primary">Continue</button></form></section><section id="inbox" hidden><h1>Enquiries</h1><button id="logout" class="btn btn--ghost">Sign out</button><button class="btn btn--ghost" id="refresh">Refresh</button><div id="list"></div></section><p id="state" role="status"></p></main><script>
const api='https://backend-for-getxh-automation.onrender.com';
let session='';
function request(path,options={}){return fetch(api+path,{...options,headers:{...options.headers,...(session?{Authorization:'Bearer '+session}:{})}});}
const state=document.querySelector('#state'),list=document.querySelector('#list');
const login=document.querySelector('#login'),inbox=document.querySelector('#inbox'),credential=document.querySelector('#credential');let challenge='';
function showLogin(){session="";login.hidden=false;inbox.hidden=true;list.replaceChildren();challenge='';credential.type='password';credential.removeAttribute('inputmode');credential.autocomplete='current-password';credential.value='';document.querySelector('#caption').textContent='Password';document.querySelector('#submit').textContent='Continue';}
async function post(path,data){const res=await request('/api/auth/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await res.json();if(!res.ok)throw Error(typeof result==='string'?result:'Request failed.');return result;}
document.querySelector('#signin').onsubmit=async e=>{e.preventDefault();const button=document.querySelector('#submit');button.disabled=true;try{if(!challenge){const r=await post('login',{password:credential.value});challenge=r.challenge;credential.value='';credential.type='text';credential.inputMode='numeric';credential.autocomplete='one-time-code';document.querySelector('#caption').textContent='Email verification code';button.textContent='Verify code';state.textContent='Check sawaisinghbusiness@gmail.com. The code expires in five minutes.';credential.focus();}else{session=(await post('verify',{challenge,code:credential.value.trim()})).session;credential.value='';await load();}}catch(err){state.textContent=err.message;if(err.message==='Request a new code.')showLogin();}finally{button.disabled=false;}};
document.querySelector('#logout').onclick=async()=>{try{await post('logout',{});showLogin();state.textContent='Signed out.';}catch(err){state.textContent=err.message;}};
async function load(){
 try{const res=await request('/api/admin/enquiries');if(res.status===401){showLogin();return;}if(!res.ok)throw Error();login.hidden=true;inbox.hidden=false;const rows=await res.json();
 list.replaceChildren();state.textContent=rows.length?rows.length+' enquiries':'No enquiries yet.';
 for(const row of rows){const card=document.createElement('article');card.className='card';
 for(const [tag,value] of [['h2',row.name],['p',[row.created+' UTC',row.plan,row.business].filter(Boolean).join(' · ')],['p',row.phone],['p',row.message]]){const el=document.createElement(tag);el.textContent=value;card.append(el);}
 const select=document.createElement('select');select.setAttribute('aria-label','Status for '+row.name);
 for(const status of ['New','Contacted','Closed'])select.add(new Option(status,status,false,status===row.status));
 select.onchange=async()=>{select.disabled=true;try{const res=await request('/api/admin/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:row.id,status:select.value})});if(!res.ok)throw Error();row.status=select.value;state.textContent='Status saved.';}catch{select.value=row.status;state.textContent='Could not save status.';}finally{select.disabled=false;}};
 card.append(select);list.append(card);}
 }catch{state.textContent='Could not load enquiries. Refresh to try again.';}}
 document.querySelector('#refresh').onclick=load;showLogin();
</script></body></html>
